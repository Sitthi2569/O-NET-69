<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบพัฒนาผลสัมฤทธิ์ O-NET ออนไลน์ 2569</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16168a; --navy-2:#2a2ab8; --navy-soft:#ecebfb; --pink:#d4239b; --pink-soft:#fde8f5;
  --bg:#f4f5fb; --card:#ffffff; --ink:#1c1d33; --muted:#6a6d86; --line:#e3e4ef;
  --ok:#14945a; --ok-soft:#e3f6ec; --bad:#d23b3b; --bad-soft:#fde9e9; --warn:#c77700; --warn-soft:#fff3dc;
  --radius:14px; --shadow:0 1px 2px rgba(20,20,80,.06),0 6px 20px rgba(20,20,80,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Prompt','Sarabun',sans-serif;line-height:1.3;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
/* header */
.top{background:linear-gradient(110deg,var(--navy) 0%,#22209e 60%,#3a1f9e 100%);color:#fff;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(212,35,155,.45),transparent 70%)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;position:relative;z-index:1}
.logo{width:58px;height:36px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:'Prompt',sans-serif;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;opacity:.82;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btn-ghost{color:#fff;border-color:rgba(255,255,255,.4)}
main{min-height:calc(100vh - 120px);padding:18px 0 40px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 16px 28px;border-top:1px solid var(--line);background:#fff}
footer b{color:var(--navy)}
/* basics */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;transition:.15s;white-space:nowrap;min-height:42px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pink{background:var(--pink)}
.btn-ok{background:var(--ok)}
.btn-bad{background:var(--bad)}
.btn-line{background:#fff;color:var(--navy);border-color:var(--line)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--navy)}
.btn-sm{padding:6px 11px;min-height:34px;font-size:14px;border-radius:8px}
.btn-block{width:100%}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px;outline:none;transition:.15s}
.input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(42,42,184,.12)}
textarea.input{min-height:90px;resize:vertical}
label.lb{display:block;font-weight:600;font-size:14px;margin:0 0 5px;color:#353756}
.field{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.grid{display:grid;gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.chip.pink{background:var(--pink-soft);color:var(--pink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.gray{background:#eef0f4;color:#5b5f73}
.hide{display:none!important}
.center{text-align:center}
.spacer{flex:1}
.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.section-title h2{font-size:19px}
/* login hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:stretch}
.hero-art{background:linear-gradient(150deg,var(--navy) 0%,#2b2bb3 55%,var(--pink) 130%);border-radius:20px;color:#fff;padding:28px;position:relative;overflow:hidden;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-art .big-logo{position:absolute;top:22px;left:24px;width:120px;background:#fff;border-radius:16px;padding:8px}
.hero-art h1{font-size:30px;font-weight:700;margin-top:90px}
.hero-art .year{align-self:flex-start;display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:3px 12px;border-radius:999px;font-size:14px;margin-bottom:10px}
.hero-art p{opacity:.9;margin:8px 0 0}
.ring-deco{position:absolute;right:-40px;top:-40px;width:220px;height:220px;border:28px solid rgba(255,255,255,.07);border-radius:50%}
.login-card{display:flex;flex-direction:column;justify-content:center;padding:28px}
.login-card h2{font-size:22px;margin-bottom:4px}
.id-input{font-size:26px;letter-spacing:4px;text-align:center;font-family:'Prompt',sans-serif;font-weight:600;min-height:60px}
.subjects-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* subject colors */
.s-th{--sc:#c2410c;--sc-soft:#fff1e8}
.s-ma{--sc:#1d4ed8;--sc-soft:#e8efff}
.s-sc{--sc:#047857;--sc-soft:#e4f6ef}
.s-en{--sc:#a21caf;--sc-soft:#f9e8fb}
.s-ot{--sc:#4b5563;--sc-soft:#eef0f3}
.subj-badge{display:inline-flex;align-items:center;gap:6px;background:var(--sc-soft);color:var(--sc);font-weight:700;border-radius:999px;padding:3px 11px;font-size:13px}
/* quiz cards */
.quiz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.quiz-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--sc)}
.quiz-card h3{font-size:17px}
.quiz-meta{display:flex;flex-wrap:wrap;gap:6px}
.student-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:54px;height:54px;border-radius:16px;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center;font-family:'Prompt';font-weight:700;font-size:22px;flex:none}
/* exam */
.exam-bar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(20,20,80,.05)}
.exam-bar .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.timer{font-family:'Prompt';font-weight:700;font-size:20px;color:var(--navy);background:var(--navy-soft);padding:4px 12px;border-radius:10px;min-width:96px;text-align:center}
.timer.low{color:var(--bad);background:var(--bad-soft);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-2),var(--pink));transition:.3s}
.exam-layout{display:grid;grid-template-columns:1fr 260px;gap:16px;margin-top:14px}
.q-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;user-select:none;-webkit-user-select:none}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.q-no{font-family:'Prompt';font-weight:700;font-size:18px;color:var(--navy)}
.q-text{font-size:17px;white-space:pre-wrap;margin-bottom:10px}
.q-img{display:block;max-width:min(100%,880px);cursor:zoom-in;height:auto;margin:6px auto 12px;border-radius:8px;border:1px solid var(--line);background:#fff}
.img-ph{display:grid;place-items:center;height:180px;border-radius:8px;background:repeating-linear-gradient(45deg,#f4f5fb,#f4f5fb 10px,#eceef7 10px,#eceef7 20px);color:var(--muted);margin:6px 0 12px}
.choices{display:grid;gap:10px;margin-top:8px}
.choice{display:flex;align-items:flex-start;gap:12px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;transition:.12s;min-height:52px}
.choice:hover{border-color:#c9c9f1}
.choice .ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #c9cbe0;display:grid;place-items:center;font-weight:700;font-family:'Prompt';color:var(--muted)}
.choice.sel{border-color:var(--navy-2);background:var(--navy-soft)}
.choice.sel .ck{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.choices.compact{grid-template-columns:repeat(4,1fr)}
.choices.compact .choice{justify-content:center;flex-direction:column;align-items:center;padding:12px 6px;gap:4px}
.choices.compact .choice .ck{width:40px;height:40px;font-size:18px}
.tf-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.tf-row .lbl{flex:1 1 180px;font-weight:600}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 16px;cursor:pointer;font-weight:600;min-width:84px}
.seg button.on{background:var(--navy-2);color:#fff}
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.order-item{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fafbff}
.order-item small{display:block;color:var(--muted);font-size:12.5px}
.order-item select{width:100%}
.nav-q{display:flex;gap:10px;margin-top:16px}
.palette{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;position:sticky;top:74px}
.pal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.pal{border:1.5px solid var(--line);background:#fff;border-radius:8px;height:38px;font-weight:700;cursor:pointer;font-size:14px;position:relative}
.pal.ans{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.pal.cur{outline:3px solid var(--pink);outline-offset:1px}
.pal.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid #fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.mobile-pal{display:none}
/* result */
.result-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:150px;height:150px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:'Prompt';font-size:22px;color:var(--navy)}
.stat span{font-size:13px;color:var(--muted)}
.review-item{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;border-left:6px solid var(--line)}
.review-item.correct{border-left-color:var(--ok)}
.review-item.wrong{border-left-color:var(--bad)}
.review-item.blank{border-left-color:#a7aabd}
.review-item.pending,.review-item.graded{border-left-color:var(--warn)}
.ans-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:15px}
.explain{background:#f7f7fe;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px;white-space:pre-wrap}
.explain b{color:var(--navy)}
/* admin */
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-radius:12px;padding:5px;box-shadow:var(--shadow);margin-bottom:16px;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:9px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button.on{background:var(--navy);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:'Prompt';font-size:26px;color:var(--navy);line-height:1.2}
.kpi small{color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.hbar{display:grid;grid-template-columns:70px 1fr 54px;align-items:center;gap:8px;font-size:14px;margin:5px 0}
.hbar .tr{height:16px;background:var(--bg);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--navy-2),#7b6cf0)}
.table-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line);background:#fff;max-height:560px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{position:sticky;top:0;background:#f7f7fc;text-align:left;font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:8px 10px;border-bottom:1px solid #f0f1f6;vertical-align:top}
table.t tr:hover td{background:#fbfbff}
table.t tr.click{cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;flex:1 1 150px;min-height:40px;padding:7px 10px}
.rate-bar{display:inline-block;width:70px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}
.rate-bar i{display:block;height:100%}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#f4f5fb}
.img-list{display:flex;gap:8px;flex-wrap:wrap}
.img-tile{position:relative;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
.img-tile img{display:block;max-width:160px;max-height:110px}
.img-tile button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;font-weight:700}
.choice-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.choice-edit .input{flex:1}
.drop{border:2px dashed #c6c8e2;border-radius:14px;padding:22px;text-align:center;background:#fafbff}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,14,50,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease-out}
.modal.wide{max-width:980px}
.modal.narrow{max-width:420px}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px;flex:1}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.warn-box{background:var(--warn-soft);color:#7a4a00;border-radius:12px;padding:12px 14px}
.bad-box{background:var(--bad-soft);color:#8f1f1f;border-radius:12px;padding:12px 14px}
.ok-box{background:var(--ok-soft);color:#0d5c37;border-radius:12px;padding:12px 14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d1e36;color:#fff;padding:10px 18px;border-radius:12px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.toast.err{background:var(--bad)}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:250;display:grid;place-items:center}
.spin{width:44px;height:44px;border:4px solid var(--navy-soft);border-top-color:var(--navy-2);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.tab-alert{position:fixed;inset:0;background:rgba(180,20,20,.88);z-index:200;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.tab-alert .box{max-width:440px}
.tab-alert h2{font-size:26px;margin-bottom:8px}
/* zoom */
.zoom-bg{position:fixed;inset:0;background:rgba(10,10,30,.92);z-index:400;display:flex;flex-direction:column}
.zoom-bar{display:flex;gap:8px;padding:10px;justify-content:center}
.zoom-bar button{background:#fff;border:0;border-radius:10px;min-width:48px;height:42px;font-size:18px;font-weight:700;cursor:pointer}
.zoom-area{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px}
.zoom-area img{display:block;margin:0 auto;background:#fff;border-radius:6px;max-width:none}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.step{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;gap:12px;align-items:flex-start}
.step i{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-family:'Prompt';font-weight:700;background:var(--navy-soft);color:var(--navy)}
.step b{display:block;font-family:'Prompt';font-weight:600}
.step span{font-size:14px;color:var(--muted)}
/* responsive */
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .hero-art{min-height:250px}
  .hero-art h1{font-size:24px;margin-top:80px}
  .exam-layout{grid-template-columns:1fr}
  .palette{display:none}
  .mobile-pal{display:block}
  .dash-grid{grid-template-columns:1fr}
  .result-hero{grid-template-columns:1fr;justify-items:center;text-align:center}
}
@media (max-width:520px){
  body{font-size:15.5px}
  .brand b{font-size:13.5px}
  .card,.q-card{padding:14px}
  .choices.compact{grid-template-columns:repeat(2,1fr)}
  .modal-bg{padding:0}
  .modal{border-radius:0;min-height:100vh}
  .timer{font-size:17px;min-width:84px}
  .kpi b{font-size:22px}
}
@media print{.top,footer,.toolbar,.tabs,.btn{display:none!important}}
</style>
</head>
<body>

function $(s, r){ return (r||document).querySelector(s); }
function $all(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function fmtDate(iso){ if(!iso) return '-'; var d=new Date(iso); if(isNaN(d)) return esc(iso); return d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}); }
function fmtDur(sec){ sec=Number(sec)||0; var m=Math.floor(sec/60), s=sec%60; return m+' นาที '+s+' วินาที'; }
function num(x,d){ x=Number(x); if(isNaN(x)) return '-'; return x.toLocaleString('th-TH',{maximumFractionDigits:d===undefined?2:d}); }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function sstore(k,v){ try{ if(v===undefined) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){ return null; } }

function call(action, payload, opt){
  opt = opt||{};
  if(!opt.silent) loading(true);
  return new Promise(function(resolve, reject){
    var done=function(raw){
      if(!opt.silent) loading(false);
      var r; try{ r = typeof raw==='string'?JSON.parse(raw):raw; }catch(e){ r={ok:false,error:'ข้อมูลตอบกลับผิดพลาด'}; }
      if(r && r.ok) resolve(r.data);
      else {
        var msg=(r&&r.error)||'เกิดข้อผิดพลาด';
        if(msg==='SESSION_EXPIRED'){ S.admin.token=null; sstore('admTok',null); msg='หมดเวลาเข้าระบบผู้ดูแล กรุณาเข้าสู่ระบบใหม่'; }
        if(!opt.quiet) toast(msg,true);
        reject(new Error(msg));
      }
    };
    var fail=function(err){ if(!opt.silent) loading(false); var m='เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: '+(err&&err.message||err); if(!opt.quiet) toast(m,true); reject(new Error(m)); };
    if(window.SUPABASE_URL && window.SUPABASE_KEY && !/YOUR-/.test(window.SUPABASE_URL+window.SUPABASE_KEY)){
      var key=window.SUPABASE_KEY, h={'Content-Type':'application/json','apikey':key};
      if(/^eyJ/.test(key)) h['Authorization']='Bearer '+key;
      fetch(window.SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/rpc/api',{method:'POST',headers:h,body:JSON.stringify({action:action,payload:payload||{}})})
        .then(function(res){ return res.json().catch(function(){ return null; }).then(function(j){
          if(!res.ok) throw new Error((j&&(j.message||j.error||j.msg))||('HTTP '+res.status));
          done(j); }); })
        .catch(fail);
    } else if(window.MOCK_API){
      setTimeout(function(){ try{ done(window.MOCK_API(action,payload||{})); }catch(e){ fail(e); } }, 120);
    } else fail(new Error('ยังไม่ได้ตั้งค่า SUPABASE_URL / SUPABASE_KEY ในไฟล์ index.html'));
  });
}

var _ld=0;
function loading(on){ _ld+=on?1:-1; if(_ld<0)_ld=0; var el=$('#ld'); if(_ld>0&&!el){ el=document.createElement('div'); el.id='ld'; el.className='loading'; el.innerHTML='<div class="spin"></div>'; document.body.appendChild(el);} if(_ld===0&&el) el.remove(); }

function toast(msg, err){ var el=$('#toast'); if(el) el.remove(); el=document.createElement('div'); el.id='toast'; el.className='toast'+(err?' err':''); el.textContent=msg; document.body.appendChild(el); clearTimeout(_tt); _tt=setTimeout(function(){ el.remove(); }, err?5000:2600); }

function modal(title, body, foot, cls){
  var root=$('#modalRoot'); var bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML='<div class="modal '+(cls||'')+'"><div class="modal-h"><h3>'+title+'</h3><button class="x" data-close>×</button></div><div class="modal-b">'+body+'</div>'+(foot?'<div class="modal-f">'+foot+'</div>':'')+'</div>';
  root.appendChild(bg);
  bg.addEventListener('click',function(e){ if(e.target.hasAttribute('data-close')) bg.remove(); });
  return bg;
}

function imgHtml(id, cls){

  if(S.imgCache[id]) return '<img class="'+(cls||'q-img')+'" src="'+S.imgCache[id]+'" alt="ภาพประกอบ">';
  return '<div class="img-ph" data-img="'+esc(id)+'" data-cls="'+(cls||'q-img')+'">กำลังโหลดภาพ…</div>';
}
function fillImages(root){
  var phs=$all('[data-img]',root); if(!phs.length) return Promise.resolve();
  var ids=[]; phs.forEach(function(p){ var i=p.getAttribute('data-img'); if(ids.indexOf(i)<0 && !S.imgCache[i]) ids.push(i); });
  var apply=function(){ $all('[data-img]',root).forEach(function(p){ var i=p.getAttribute('data-img'); if(S.imgCache[i]){ var im=document.createElement('img'); im.className=p.getAttribute('data-cls'); im.src=S.imgCache[i]; im.alt='ภาพประกอบ'; p.replaceWith(im);} else if(p._tried){ p.textContent='โหลดภาพไม่สำเร็จ'; } p._tried=1; }); };
  if(!ids.length){ apply(); return Promise.resolve(); }
  return loadImages(ids).then(apply, apply);
}
function loadImages(ids){
  ids=ids.filter(function(i){ return i && !S.imgCache[i]; });
  if(!ids.length) return Promise.resolve();
  var batches=[]; for(var i=0;i<ids.length;i+=6) batches.push(ids.slice(i,i+6));
  return Promise.all(batches.map(function(b){ return call('getImages',{ids:b},{silent:true,quiet:true}).then(function(m){ for(var k in m) S.imgCache[k]=m[k]; }); }));
}

/* ======================================================================
   Exam (taker interface)
   ====================================================================== */
function startExam(qid){
  call('startQuiz',{studentId:S.student.student.studentId, quizId:qid}).then(function(d){
    var key='ans_'+d.attemptId, local=store(key)||{};
    var answers=Object.assign({}, d.savedAnswers||{}, local.answers||{});
    S.exam={ id:d.attemptId, quiz:d.quiz, qs:d.questions, deadline:d.deadline, offset:d.serverNow-Date.now(),
      answers:answers, flags:local.flags||{}, idx:local.idx||0, tabs:d.tabSwitches||0, dirty:false, submitting:false, lastSwitch:0 };
    if(S.exam.idx>=S.exam.qs.length) S.exam.idx=0;
    if(d.resumed) toast('กลับมาทำต่อจากที่ค้างไว้');
    setTop('');
    bindExamGuards(true);
    renderExam();
    // prefetch images of first few questions
    var ids=[]; S.exam.qs.slice(0,4).forEach(function(q){ ids=ids.concat(q.images); }); loadImages(ids);
    S.exam.timer=setInterval(tick,1000); tick();
    S.exam.saver=setInterval(function(){ saveProgress(false); }, 45000);
  });
}
function stopExam(){
  if(S.exam){ clearInterval(S.exam.timer); clearInterval(S.exam.saver); }
  bindExamGuards(false);
  var t=$('.tab-alert'); if(t) t.remove();
}
function remaining(){ return S.exam.deadline-(Date.now()+S.exam.offset); }
function tick(){
  var e=S.exam; if(!e) return;
  var el=$('#timer'); var r=remaining();
  if(!e.quiz.timeLimit){ if(el) el.textContent='∞'; return; }
  if(r<=0){ if(el) el.textContent='00:00'; if(!e.submitting) submitExam('timeout'); return; }
  var s=Math.floor(r/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  if(el){ el.textContent=(h?h+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); el.classList.toggle('low', r<5*60000); }
  if(s===300) toast('เหลือเวลา 5 นาที');
}
function persistLocal(){ var e=S.exam; if(!e) return; store('ans_'+e.id,{answers:e.answers,flags:e.flags,idx:e.idx}); e.dirty=true; }
function saveProgress(force){
  var e=S.exam; if(!e||(!e.dirty&&!force)||e.submitting) return Promise.resolve();
  e.dirty=false;
  return call('saveProgress',{attemptId:e.id, studentId:S.student.student.studentId, answers:e.answers},{silent:true,quiet:true})
    .then(function(r){ if(r&&r.closed){ toast('การสอบนี้ถูกปิดแล้ว'); stopExam(); refreshStudent(); } }).catch(function(){ e.dirty=true; });
}

/* anti-cheat: tab switch detection */
function onVis(){ if(document.visibilityState==='hidden') registerSwitch('ออกจากหน้าจอ/สลับแท็บ'); }
function onBlur(){ setTimeout(function(){ if(!document.hasFocus() && document.visibilityState==='visible') registerSwitch('สลับไปหน้าต่างอื่น'); }, 300); }
function onBeforeUnload(e){ if(S.exam && !S.exam.submitting){ saveProgress(true); e.preventDefault(); e.returnValue=''; return ''; } }
function blockEvt(e){ if(S.exam && $('.q-card') && $('.q-card').contains(e.target)) e.preventDefault(); }
function bindExamGuards(on){
  var f=on?'addEventListener':'removeEventListener';
  document[f]('visibilitychange',onVis); window[f]('blur',onBlur); window[f]('beforeunload',onBeforeUnload);
  document[f]('contextmenu',blockEvt); document[f]('copy',blockEvt);
}
function registerSwitch(kind){
  var e=S.exam; if(!e||e.submitting) return;
  var now=Date.now(); if(now-e.lastSwitch<1500) return; e.lastSwitch=now;
  e.tabs++;
  updateTabChip();
  call('logEvent',{attemptId:e.id, studentId:S.student.student.studentId, type:kind},{silent:true,quiet:true}).then(function(r){
    if(r && r.tabSwitches>e.tabs){ e.tabs=r.tabSwitches; updateTabChip(); }
    checkTabLimit();
  }).catch(function(){});
  saveProgress(true);
  var max=e.quiz.maxTabSwitch;
  if(max && e.tabs>max){ checkTabLimit(); return; }
  var old=$('.tab-alert'); if(old) old.remove();
  var d=document.createElement('div'); d.className='tab-alert';

  document.body.appendChild(d); $('#tabBack').onclick=function(){ d.remove(); };
}
function checkTabLimit(){ var e=S.exam; if(e && e.quiz.maxTabSwitch && e.tabs>e.quiz.maxTabSwitch && !e.submitting){ var t=$('.tab-alert'); if(t) t.remove(); toast('สลับหน้าจอเกินกำหนด ระบบส่งคำตอบอัตโนมัติ',true); submitExam('tab'); } }
function updateTabChip(){ var c=$('#tabChip'); if(c){ c.textContent='สลับจอ '+S.exam.tabs+(S.exam.quiz.maxTabSwitch?'/'+S.exam.quiz.maxTabSwitch:''); c.className='chip '+(S.exam.tabs?'bad':'gray'); } }

function isAnswered(q){
  var a=S.exam.answers[q.id];
  if(a===undefined||a===null||a==='') return false;
  if(Array.isArray(a)) { if(q.type==='order'){ var oc0=orderCfg(q), g=oc0.given; return a.length>=oc0.n && a.every(function(x,i){ return x!=='' && x!==null && x!==undefined || g[i+1]; }); } return a.every(function(x){ return x!=='' && x!==null && x!==undefined; }); }
  return true;
}
function answeredCount(){ return S.exam.qs.filter(isAnswered).length; }

function renderPalette(){
  var e=S.exam;
  var html=e.qs.map(function(q,i){ return '<button class="pal'+(isAnswered(q)?' ans':'')+(i===e.idx?' cur':'')+(e.flags[q.id]?' flag':'')+'" onclick="goQ('+i+')">'+(i+1)+'</button>'; }).join('');
  ['#pal','#palM'].forEach(function(s){ var el=$(s); if(el) el.innerHTML=html; });
  var c=answeredCount()+'/'+e.qs.length;

function goQ(i){ S.exam.idx=Math.max(0,Math.min(S.exam.qs.length-1,i)); persistLocal(); renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }

function isImageChoices(ch){ return !ch.length || ch.every(function(c,i){ return String(c).trim()===String(i+1); }); }
function orderCfg(q){ var c=q.choices; if(Array.isArray(c)) c={n:c.length, words:c}; c=c||{}; return {n:Number(c.n)||((c.words||[]).length)||10, given:c.given||{}, words:c.words||[]}; }
function tfCfg(q){ var c=q.choices; if(Array.isArray(c)) return {items:c, options:['ใช่','ไม่ใช่']}; return {items:c.items||[], options:c.options||['ใช่','ไม่ใช่']}; }

function answerUI(q, val, readonly){
  var ro=readonly?' disabled':'';
  if(q.type==='mcq'){
    var ch=q.choices||[]; var img=isImageChoices(ch); if(!ch.length) ch=['1','2','3','4'];
    return (img?'<div class="small muted" style="margin-bottom:4px">เลือกหมายเลขคำตอบตามโจทย์ในภาพ</div>':'')+
      '<div class="choices'+(img?' compact':'')+'">'+ch.map(function(c,i){ var k=String(i+1);
      return '<button type="button" class="choice'+(String(val)===k?' sel':'')+'" data-ans="'+k+'"'+ro+'><span class="ck">'+k+'</span>'+(img?'<span class="small muted">ตัวเลือก '+k+'</span>':'<span>'+esc(c)+'</span>')+'</button>'; }).join('')+'</div>';
  }
  if(q.type==='numeric') return '<label class="lb">ตอบเป็นตัวเลข</label><input class="input" style="font-size:22px;max-width:260px;font-weight:700" inputmode="decimal" data-inp value="'+esc(val||'')+'" placeholder="พิมพ์ตัวเลขคำตอบ"'+ro+'>';
  if(q.type==='short') return '<label class="lb">คำตอบ</label><input class="input" data-inp value="'+esc(val||'')+'" placeholder="พิมพ์คำตอบ"'+ro+'>';
  if(q.type==='essay') return '<label class="lb">เขียนคำตอบ</label><textarea class="input" data-inp rows="6" style="user-select:text"'+ro+' placeholder="พิมพ์คำตอบของนักเรียน">'+esc(val||'')+'</textarea><div class="small muted" id="essayCount"></div>';
  if(q.type==='multi_tf'){
    var cfg=tfCfg(q); var arr=Array.isArray(val)?val:[];
    return cfg.items.map(function(it,i){ return '<div class="tf-row"><div class="lbl">'+esc(it)+'</div><div class="seg">'+cfg.options.map(function(o){ return '<button type="button" class="'+(arr[i]===o?'on':'')+'" data-tf="'+i+'" data-v="'+esc(o)+'"'+ro+'>'+esc(o)+'</button>'; }).join('')+'</div></div>'; }).join('');
  }
  if(q.type==='order'){
    var oc=orderCfg(q); var av=Array.isArray(val)?val:[];
    var opts=function(sel){ var s='<option value="">—</option>'; for(var k=1;k<=oc.n;k++) s+='<option value="'+k+'"'+(String(sel)===String(k)?' selected':'')+'>'+k+(oc.words[k-1]?' . '+esc(oc.words[k-1]):'')+'</option>'; return s; };
    var h='<div class="small muted" style="margin-bottom:8px">เลือกหมายเลขคำให้ตรงกับลำดับในประโยค</div><div class="order-grid">';
    for(var p=1;p<=oc.n;p++){ var g=oc.given[p]; h+='<div class="order-item"><small>คำลำดับที่ '+p+'</small>'+(g?'<div style="font-weight:700;padding:8px 2px">'+esc(g)+(oc.words[g-1]?' . '+esc(oc.words[g-1]):'')+' <span class="chip gray">กำหนดให้</span></div>':'<select class="input" data-ord="'+(p-1)+'"'+ro+'>'+opts(av[p-1])+'</select>')+'</div>'; }
    return h+'</div>';
  }
  return '';
}
function questionBody(q){
  return (q.text?'<div class="q-text">'+esc(q.text)+'</div>':'')+ (q.images||[]).map(function(i){ return imgHtml(i); }).join('');
}
function renderQuestion(){
  var e=S.exam, q=e.qs[e.idx], n=e.qs.length;
  var box=$('#qBox');
  box.innerHTML='<div class="q-card '+subjClass(q.subject)+'"><div class="q-head"><span class="q-no">ข้อที่ '+(e.idx+1)+' <span class="muted" style="font-size:14px;font-weight:500">/ '+n+'</span></span>'+
    '<span class="subj-badge">'+esc(q.subject)+'</span><span class="chip gray">'+(TYPES[q.type]||'')+'</span><span class="spacer"></span>'+
    '<button class="btn btn-line btn-sm" id="flagBtn">'+(e.flags[q.id]?'★ ทำเครื่องหมายแล้ว':'☆ ทำเครื่องหมาย')+'</button></div>'+
    questionBody(q)+'<div id="ansBox">'+answerUI(q, e.answers[q.id])+'</div>'+
    '<div class="nav-q"><button class="btn btn-line" '+(e.idx===0?'disabled':'')+' onclick="goQ(S.exam.idx-1)">‹ ข้อก่อนหน้า</button><span class="spacer"></span>'+
    (e.idx<n-1?'<button class="btn" onclick="goQ(S.exam.idx+1)">ข้อถัดไป ›</button>':'<button class="btn btn-pink" onclick="confirmSubmit()">ส่งคำตอบ</button>')+'</div></div>';
  fillImages(box);
  // prefetch next
  var nx=e.qs[e.idx+1]; if(nx) loadImages(nx.images||[]);
  $('#flagBtn').onclick=function(){ e.flags[q.id]=!e.flags[q.id]; persistLocal(); renderQuestion(); };
  bindAnswer(q, box);
  renderPalette();
}
function setAns(q,v){ S.exam.answers[q.id]=v; persistLocal(); renderPalette(); }
function bindAnswer(q, box){
  $all('[data-ans]',box).forEach(function(b){ b.onclick=function(){ $all('[data-ans]',box).forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); setAns(q,b.getAttribute('data-ans')); }; });
  var inp=$('[data-inp]',box); if(inp){ var upd=function(){ setAns(q,inp.value); var c=$('#essayCount'); if(c) c.textContent=inp.value.length+' ตัวอักษร'; }; inp.oninput=upd; if(q.type==='essay') upd(); }
  $all('[data-tf]',box).forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute('data-tf'); var arr=(S.exam.answers[q.id]||[]).slice(); var cfg=tfCfg(q); while(arr.length<cfg.items.length) arr.push(''); arr[i]=b.getAttribute('data-v'); $all('[data-tf="'+i+'"]',box).forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); setAns(q,arr); }; });
  $all('[data-ord]',box).forEach(function(s){ s.onchange=function(){ var oc=orderCfg(q); var arr=(S.exam.answers[q.id]||[]).slice(); while(arr.length<oc.n) arr.push(''); for(var p in oc.given) arr[p-1]=String(oc.given[p]); arr[+s.getAttribute('data-ord')]=s.value; setAns(q,arr); }; });
}
function confirmSubmit(){
  var e=S.exam; var left=e.qs.length-answeredCount();
  confirmBox((left?'ยังไม่ได้ตอบ '+left+' ข้อ\n':'ตอบครบทุกข้อแล้ว\n')+'ต้องการส่งคำตอบหรือไม่? ส่งแล้วแก้ไขไม่ได้','ส่งคำตอบ','btn-pink').then(function(ok){ if(ok) submitExam('manual'); });
}
function submitExam(reason){
  var e=S.exam; if(!e||e.submitting) return; e.submitting=true;
  // complete order answers with given words
  e.qs.forEach(function(q){ if(q.type==='order'&&Array.isArray(e.answers[q.id])){ var oc=orderCfg(q); for(var p in oc.given) e.answers[q.id][p-1]=String(oc.given[p]); } });
  var payload={attemptId:e.id, studentId:S.student.student.studentId, answers:e.answers, tabSwitches:e.tabs, reason:reason};
  var attempt=function(n){
    return call('submitQuiz',payload).then(function(res){
      store('ans_'+e.id,null); stopExam(); S.exam=null; $('#examBar').innerHTML='';
      renderResult(res, true);
    }).catch(function(err){
      if(n<3) return new Promise(function(r){ setTimeout(r,2500); }).then(function(){ return attempt(n+1); });
      e.submitting=false; toast('ส่งคำตอบไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วกดส่งอีกครั้ง',true);
    });
  };
  attempt(1);
}

function viewResult(id){ call('getResult',{attemptId:id, studentId:S.student.student.studentId}).then(function(r){ renderResult(r,false); }); }
function ringSvg(p){
  p=Math.max(0,Math.min(100,Number(p)||0)); var r=62, c=2*Math.PI*r, col=p>=80?'#14945a':p>=50?'#2a2ab8':'#d23b3b';
  return '<svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="#ecebfb" stroke-width="14"/><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+(c*p/100)+' '+c+'" transform="rotate(-90 75 75)"/><text x="75" y="80" text-anchor="middle" font-family="Prompt" font-weight="700" font-size="30" fill="'+col+'">'+num(p,1)+'%</text><text x="75" y="102" text-anchor="middle" font-size="12" fill="#6a6d86">คะแนนร้อยละ</text></svg>';
}
function fmtAnswer(q, a){
  if(a===undefined||a===null||a===''||(Array.isArray(a)&&!a.join(''))) return '<span class="muted">(ไม่ได้ตอบ)</span>';
  if(q.type==='mcq'){ var ch=q.choices||[]; var img=isImageChoices(ch); return 'ข้อ '+esc(a)+(!img&&ch[a-1]?' — '+esc(ch[a-1]):''); }
  if(q.type==='multi_tf'){ var cfg=tfCfg(q); var arr=Array.isArray(a)?a:String(a).split(','); return arr.map(function(x,i){ return esc(cfg.items[i]||('ข้อย่อย '+(i+1)))+': <b>'+esc(x||'-')+'</b>'; }).join(' · '); }
  if(q.type==='order'){ var arr2=Array.isArray(a)?a:String(a).split(','); return arr2.map(function(x){ return esc(x||'_'); }).join(' , '); }
  return esc(Array.isArray(a)?a.join(', '):a);
}
var STATUS={correct:['ถูก','ok'],wrong:['ผิด','bad'],blank:['ไม่ได้ตอบ','gray'],pending:['รอครูตรวจ','warn'],graded:['ครูตรวจแล้ว','warn'],missing:['ข้อถูกลบ','gray']};
function reviewItem(it, opts){
  opts=opts||{};
  var st=STATUS[it.status]||['-','gray'];
  return '<div class="review-item '+it.status+'" data-st="'+it.status+'"><div class="q-head" style="margin-bottom:4px"><span class="q-no">ข้อ '+it.no+'</span><span class="chip '+st[1]+'">'+(it.status==='correct'?'✓ ':it.status==='wrong'?'✗ ':'')+st[0]+'</span><span class="chip gray">'+num(it.earned)+'/'+num(it.points)+' คะแนน</span><span class="spacer"></span><button class="btn btn-line btn-sm" data-toggle>ดูโจทย์</button></div>'+
    '<div class="q-body hide">'+questionBody(it)+'</div>'+
    '<div class="ans-line"><span class="muted">คำตอบของนักเรียน:</span> <span>'+fmtAnswer(it,it.yourAnswer)+'</span></div>'+
    (it.answer!==undefined && it.type!=='essay'?'<div class="ans-line"><span class="muted">คำตอบที่ถูก:</span> <b style="color:var(--ok)">'+fmtAnswer(it,it.type==='multi_tf'||it.type==='order'?String(it.answer).split(','):String(it.answer).split('|')[0])+'</b></div>':'')+
    (it.explanation?'<div class="explain"><b>'+(it.type==='essay'?'แนวคำตอบ':'เฉลย/คำอธิบาย')+':</b> '+esc(it.explanation)+'</div>':'')+
    (opts.grade && it.type==='essay'?'<div class="row" style="margin-top:10px;align-items:center"><label class="lb" style="flex:0 0 auto;margin:0">ให้คะแนน (เต็ม '+it.points+')</label><input class="input" type="number" min="0" max="'+it.points+'" step="0.5" style="max-width:120px" value="'+(it.status==='graded'?it.earned:'')+'" data-essay="'+it.id+'"><button class="btn btn-sm btn-ok" style="flex:0 0 auto" data-essay-save="'+it.id+'">บันทึกคะแนน</button></div>':'')+

function bindReview(root){
  $all('[data-toggle]',root).forEach(function(b){ b.onclick=function(){ var body=b.closest('.review-item').querySelector('.q-body'); body.classList.toggle('hide'); b.textContent=body.classList.contains('hide')?'ดูโจทย์':'ซ่อนโจทย์'; if(!body.classList.contains('hide')) fillImages(body); }; });
}
function renderResult(r, fresh){

    '<div class="stat"><b>'+num(r.correctCount,0)+'/'+num(r.totalCount,0)+'</b><span>ตอบถูก (ข้อ)</span></div>'+
    '<div class="stat"><b style="font-size:17px">'+fmtDur(r.durationSec)+'</b><span>เวลาที่ใช้</span></div>'+
    '<div class="stat"><b style="color:'+(Number(r.tabSwitches)?'var(--bad)':'var(--navy)')+'">'+num(r.tabSwitches,0)+'</b><span>ครั้งที่สลับหน้าจอ</span></div></div>'+
    (r.note?'<div class="warn-box small" style="margin-top:10px">'+esc(r.note)+'</div>':'')+
    (r.items.some(function(i){return i.status==='pending';})?'<div class="warn-box small" style="margin-top:10px">ข้อเขียนตอบ (อัตนัย) รอครูตรวจ คะแนนรวมอาจเพิ่มขึ้นภายหลัง</div>':'')+
    '</div></div>'+
    (r.items.length?'<div class="section-title"><h2>ผลรายข้อ'+(r.reveal?' และเฉลย':'')+'</h2><span class="spacer"></span><select class="input" style="width:auto;min-height:38px;padding:6px 10px" id="rvFilter"><option value="">ทุกข้อ ('+r.items.length+')</option><option value="wrong">เฉพาะข้อผิด/ไม่ได้ตอบ ('+wrong+')</option><option value="correct">เฉพาะข้อถูก</option></select></div><div class="grid" id="rvList">'+r.items.map(function(i){return reviewItem(i);}).join('')+'</div>'
      :'<div class="card empty" style="margin-top:14px">'+esc(r.revealMessage||'')+'</div>')+
    '<div class="center" style="margin-top:20px"><button class="btn" onclick="refreshStudent()">กลับหน้าหลักนักเรียน</button></div>';
  bindReview($('#app'));

function resizeImage(file, maxW){
  return new Promise(function(res, rej){
    var r=new FileReader(); r.onerror=rej;
    r.onload=function(){ var img=new Image(); img.onerror=rej; img.onload=function(){ var s=Math.min(1,maxW/img.width); var cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s); var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
      var url=cv.toDataURL('image/webp',0.8); if(url.indexOf('image/webp')<0) url=cv.toDataURL('image/jpeg',0.82); res(url); }; img.src=r.result; };
    r.readAsDataURL(file);
  });
}

function csvToObjects(text){
  var rows=[], row=[], cell='', q=false; text=text.replace(/^﻿/,'');
  for(var i=0;i<text.length;i++){ var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cell); cell=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  rows=rows.filter(function(r){ return r.join('').trim(); });
  var head=rows.shift()||[]; return rows.map(function(r){ var o={}; head.forEach(function(h,i){ o[String(h).trim()]=r[i]===undefined?'':r[i]; }); return o; });
}
var TH_HEAD={'วิชา':'subject','ระดับชั้น':'grade','ชั้น':'grade','รูปแบบ':'type','ประเภท':'type','โจทย์':'text','คำถาม':'text','คำตอบ':'answer','เฉลย':'answer','คำอธิบาย':'explanation','แท็ก':'tags','ความยาก':'difficulty','ความยากง่าย':'difficulty','คะแนน':'points','รูปภาพ':'image','รูป':'image'};
var TYPE_ALIAS={'ปรนัย':'mcq','เลือกตอบ':'mcq','ตัวเลข':'numeric','เติมตัวเลข':'numeric','เติมคำ':'short','อัตนัย':'essay','เขียนตอบ':'essay','เรียงลำดับ':'order','เชิงซ้อน':'multi_tf'};
function letterToIndex(a){ a=String(a).trim(); var th='กขคงจ', en='abcde'; if(th.indexOf(a.charAt(0))>=0&&a.length<=2) return th.indexOf(a.charAt(0))+1; if(en.indexOf(a.toLowerCase())>=0&&a.length===1) return en.indexOf(a.toLowerCase())+1; var n=String(a).replace(/[๐-๙]/g,function(d){return '๐๑๒๓๔๕๖๗๘๙'.indexOf(d);}); return n; }
function mapSheetRow(r){
  var o={}; Object.keys(r).forEach(function(k){ var kk=String(k).trim(); var m=/^ตัวเลือก\s*(\d)$/.exec(kk); if(m) kk='choice'+m[1]; kk=TH_HEAD[kk]||kk.toLowerCase(); o[kk]=r[k]; });
  if(!String(o.text||'').trim()&&!o.image) return null;
  var type=String(o.type||'').trim(); type=TYPE_ALIAS[type]||type||'mcq';
  var ch=[1,2,3,4,5].map(function(i){ return String(o['choice'+i]===undefined?'':o['choice'+i]).trim(); }).filter(String);
  var ans=String(o.answer===undefined?'':o.answer).trim(); if(type==='mcq') ans=String(letterToIndex(ans));
  return {subject:String(o.subject||'').trim(), grade:String(o.grade||'').trim(), type:type, text:String(o.text||''), images:String(o.image||'').trim(), choices:type==='mcq'?ch:[], answer:ans, explanation:String(o.explanation||''), tags:String(o.tags||''), difficulty:String(o.difficulty||'').trim(), points:o.points};
}
function parseTextQuestions(text){
  var lines=String(text||'').replace(/\r/g,'').split('\n'), out=[], cur=null;
  var qRe=/^\s*(?:ข้อ\s*)?([0-9๐-๙]{1,3})\s*[.)]\s*(.+)$/, cRe=/^\s*(\*?)\s*([ก-จ]|[a-eA-E]|[1-5๑-๕])\s*[.)]\s*(\*?)\s*(.+)$/, aRe=/^\s*(?:ตอบ|เฉลย|คำตอบ|answer|ans)\s*[:：]?\s*(.+)$/i, xRe=/^\s*(?:อธิบาย|คำอธิบาย|explanation)\s*[:：]\s*(.+)$/i;
  var push=function(){ if(cur&&cur.text){ out.push(cur); } };
  lines.forEach(function(l){
    if(!l.trim()) return;
    var m;
    if((m=aRe.exec(l))&&cur){ cur.answer=String(letterToIndex(m[1].trim().replace(/[.)]$/,''))); return; }
    if((m=xRe.exec(l))&&cur){ cur.explanation=m[1].trim(); return; }
    if(cur && (m=cRe.exec(l))){
      var lab=m[2], isNum=/^[0-9๐-๙]/.test(lab), expect=cur.choices.length+1;
      var labIdx=isNum?Number(String(lab).replace(/[๐-๙]/g,function(d){return '๐๑๒๓๔๕๖๗๘๙'.indexOf(d);})):letterToIndex(lab);
      if(!isNum || Number(labIdx)===expect){
        cur.choices.push(m[4].trim()); if(m[1]||m[3]) cur.answer=String(expect); return;
      }
    }
    if((m=qRe.exec(l))){ push(); cur={type:'mcq',text:m[2].trim(),choices:[],answer:'',explanation:''}; return; }
    if(cur){ if(cur.choices.length) cur.choices[cur.choices.length-1]+=' '+l.trim(); else cur.text+='\n'+l.trim(); }
  });
  push();
  return out.map(function(q){ if(!q.choices.length) q.type='short'; return q; });
}

      '<label class="btn btn-sm" style="flex:0 0 auto">📥 นำเข้า Excel<input type="file" id="stFile" accept=".xlsx,.xls,.csv" hidden></label></div>'+
      '<div class="small muted" style="margin-bottom:8px">ทั้งหมด '+list.length+' คน · ไฟล์นำเข้าใช้หัวคอลัมน์: เลขประจำตัว, คำนำหน้า, ชื่อ, สกุล, ชั้น, ห้อง, เลขที่, เพศ (ไม่ต้องใส่เลขประจำตัวประชาชน)</div>'+
      '<div class="table-wrap"><table class="t" id="stT"><thead><tr><th>เลขประจำตัว</th><th>ชื่อ-สกุล</th><th>ชั้น/ห้อง</th><th>เลขที่</th><th>เพศ</th></tr></thead><tbody>'+
      list.map(function(s){ return '<tr data-s="'+esc((s.studentId+' '+s.firstName+' '+s.lastName).toLowerCase())+'" data-r="'+esc(s.room)+'"><td><b>'+esc(s.studentId)+'</b></td><td>'+esc(s.prefix+s.firstName+' '+s.lastName)+'</td><td>'+esc(s.grade)+'/'+esc(s.room)+'</td><td>'+esc(s.number)+'</td><td>'+esc(s.gender)+'</td></tr>'; }).join('')+'</tbody></table></div>';
    var f=function(){ var v=$('#stQ').value.trim().toLowerCase(), r=$('#stR').value; $all('#stT tbody tr').forEach(function(tr){ tr.classList.toggle('hide',(v&&tr.getAttribute('data-s').indexOf(v)<0)||(r&&tr.getAttribute('data-r')!==r)); }); };
    $('#stQ').oninput=f; $('#stR').onchange=f;
    $('#stFile').onchange=function(){ var file=this.files[0]; if(!file) return;
      var go=function(rows){ var map={'เลขประจำตัว':'studentId','เลขประจำตัวนักเรียน':'studentId','คำนำหน้า':'prefix','ชื่อ':'firstName','สกุล':'lastName','นามสกุล':'lastName','ชั้น':'grade','ห้อง':'room','เลขที่':'number','เพศ':'gender'};
        var out=rows.map(function(r){ var o={}; Object.keys(r).forEach(function(k){ var kk=map[String(k).trim()]||String(k).trim(); if(SCHEMA_ST.indexOf(kk)>=0) o[kk]=String(r[k]).trim(); }); return o; }).filter(function(o){ return o.studentId; });
        if(!out.length) return toast('ไม่พบคอลัมน์ "เลขประจำตัว"',true);
        var m=modal('นำเข้ารายชื่อนักเรียน','พบนักเรียน <b>'+out.length+'</b> คน<br><br><label><input type="radio" name="stMode" value="append" checked> เพิ่มเฉพาะคนที่ยังไม่มี</label><br><label><input type="radio" name="stMode" value="replace"> แทนที่รายชื่อเดิมทั้งหมด</label>','<button class="btn btn-line" data-close>ยกเลิก</button><button class="btn" id="stGo">นำเข้า</button>','narrow');
        $('#stGo',m).onclick=function(){ adminCall('importStudents',{rows:out,replace:$('input[name=stMode]:checked',m).value==='replace'}).then(function(r){ m.remove(); toast('นำเข้า '+r.imported+' คน (ข้าม '+r.skipped+')'); renderStudents(); }); }; };
      if(/\.csv$/i.test(file.name)){ var rd=new FileReader(); rd.onload=function(){ go(csvToObjects(rd.result)); }; rd.readAsText(file,'utf-8'); }
      else { loading(true); needXLSX().then(function(){ var rd=new FileReader(); rd.onload=function(){ loading(false); var wb=XLSX.read(rd.result,{type:'array'}); go(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})); }; rd.readAsArrayBuffer(file); }).catch(function(e){ loading(false); toast(e.message,true); }); }
      this.value=''; };
  });
}
var SCHEMA_ST=['studentId','prefix','firstName','lastName','grade','room','number','gender'];

/* ---------------- Settings ---------------- */
function renderSettings(){
  adminCall('getSettings',{}).then(function(list){
    var labels={SYSTEM_TITLE:'ชื่อระบบ',ACADEMIC_YEAR:'ปีการศึกษา',SCHOOL_NAME:'ชื่อโรงเรียน',AREA_NAME:'สังกัด',ADMIN_PASSWORD:'รหัสผ่านผู้ดูแล',DEVELOPER:'ผู้พัฒนา'};
    $('#adm').innerHTML='<div class="card" style="max-width:720px">'+list.map(function(s){ return '<div class="field"><label class="lb">'+esc(labels[s.key]||s.key)+'</label><input class="input" data-key="'+esc(s.key)+'" type="'+(s.key==='ADMIN_PASSWORD'?'password':'text')+'" value="'+esc(s.value)+'"></div>'; }).join('')+
      '<button class="btn" id="setSave">บันทึกการตั้งค่า</button></div>';
    $('#setSave').onclick=function(){ adminCall('saveSettings',{settings:$all('[data-key]').map(function(i){ return {key:i.getAttribute('data-key'),value:i.value}; })}).then(function(){ toast('บันทึกแล้ว'); loadInfo(); }); };
  });
}

/* tap image to zoom */
document.addEventListener('click',function(e){
  var t=e.target; if(!(t && t.classList && t.classList.contains('q-img'))) return;
  var z=1, nat=t.naturalWidth||900, fit=Math.min(window.innerWidth-20, nat);
  var bg=document.createElement('div'); bg.className='zoom-bg';
  bg.innerHTML='<div class="zoom-bar"><button data-z="-">−</button><button data-z="+">+</button><button data-z="x" style="min-width:90px;font-size:15px">ปิด ✕</button></div><div class="zoom-area"><img src="'+t.src+'"></div>';
  document.body.appendChild(bg);
  var img=bg.querySelector('img'); var apply=function(){ img.style.width=Math.round(fit*z)+'px'; }; z=window.innerWidth<700?1.6:1; apply();
  bg.querySelector('.zoom-bar').onclick=function(ev){ var k=ev.target.getAttribute('data-z'); if(k==='+'){ z=Math.min(4,z+0.35); apply(); } else if(k==='-'){ z=Math.max(0.5,z-0.35); apply(); } else if(k==='x') bg.remove(); };
});
window.addEventListener('hashchange',function(){ if(location.hash==='#admin' && !S.exam) openAdmin(); });
boot();
